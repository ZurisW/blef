services:
  blef:
    build: .
    image: blef:latest
    # rebuild the image on every `docker compose up -d` (needs Compose v2.22+),
    # otherwise a plain `up -d` keeps running the old image after `git pull`
    pull_policy: build
    container_name: blef
    ports:
      - "3001:3001"
    restart: unless-stopped
    environment:
      PORT: "3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/"]
      interval: 30s
      timeout: 3s
      retries: 3
